<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Campus Cash · Offline draft</title><style>body{background:#071b13;color:#edf5ef;font:16px system-ui;max-width:480px;margin:6vh auto;padding:24px}h1{font-size:28px}label{display:grid;gap:8px;margin:18px 0}input,select,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border-radius:10px;border:1px solid #496b55;background:#142e21;color:inherit}button{background:#d1b47a;color:#102416;font-weight:bold}p{line-height:1.6;color:#bdd1c4}a{color:#e8cc96}</style><h1>Keep the expense. Reconnect later.</h1><p>You are offline. This draft stays on this device. After reconnecting, sign in and choose “Recover offline draft” on Overview.</p><form id="draft"><label>Description<input name="description" required></label><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Category<input name="category" value="Food" required></label><label>Account<input name="account" value="UPI wallet" required></label><button>Save draft on this device</button></form><p id="status" role="status"></p><a href="/">Reconnect to Campus Cash</a><script>const form=document.getElementById('draft'),status=document.getElementById('status');try{const saved=JSON.parse(localStorage.getItem('campus-offline-draft')||'null');if(saved)for(const [k,v]of Object.entries(saved))if(form.elements[k])form.elements[k].value=v;}catch{}form.addEventListener('submit',e=>{e.preventDefault();try{localStorage.setItem('campus-offline-draft',JSON.stringify(Object.fromEntries(new FormData(form))));status.textContent='Draft saved on this device. It has not been added to your account.';}catch{status.textContent='Device storage is unavailable. Keep this page open to retain the draft.';}});</script></html>
